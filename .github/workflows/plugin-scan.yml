name: Plugin Security Scan
on: [pull_request, push]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@55616c962cf86368423f7673b2ecdfdbe613d1af # v1.2.515
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          # Only file/update the catalog submission issue from a real push to
          # master, never from a PR (forked PRs don't get repo secrets, and we
          # don't want every branch push opening/touching the issue).
          submission_enabled: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          submission_score_threshold: 80
          submission_token: ${{ secrets.AWESOME_SUBMISSION_TOKEN }}
          submission_repos: hashgraph-online/awesome-ai-plugins
